# Local development stack — see docs/LOCAL-DOCKER.md
#
#   npm run docker:dev   → web dev server (5173) + functions API (9999)
#   npm run stack:up     → local Supabase (via CLI) + web + functions
#
# Overrides live in .env.docker (copied from .env.docker.example by the npm
# scripts, loaded via `--env-file .env.docker`). Plain `docker compose up`
# also works and uses the defaults below, which point at the local Supabase
# stack started by `npx supabase start`.

name: edmeca-academy

x-dev-volumes: &dev-volumes
  volumes:
    - .:/app
    - node_modules:/app/node_modules

services:
  web:
    build:
      context: .
      args:
        BASE_IMAGE: ${BASE_IMAGE:-node:20.19-bookworm-slim}
      target: dev
    ports:
      - "5173:5173"
    environment:
      # Browser-facing Supabase URL — the local CLI stack publishes on the host
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-http://127.0.0.1:54321}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
      VITE_ENABLE_LOGIN: ${VITE_ENABLE_LOGIN:-true}
      VITE_BYPASS_AUTH: ${VITE_BYPASS_AUTH:-true}
      VITE_AI_API_URL: ${VITE_AI_API_URL:-}
      # vite dev proxy target: /api/* → Netlify functions container
      FUNCTIONS_ORIGIN: http://functions:9999
    <<: *dev-volumes
    depends_on:
      - functions

  functions:
    build:
      context: .
      args:
        BASE_IMAGE: ${BASE_IMAGE:-node:20.19-bookworm-slim}
      target: functions
    ports:
      - "9999:9999"
    environment:
      # Container-to-host URL: the local Supabase stack is published on the host
      VITE_SUPABASE_URL: ${SUPABASE_INTERNAL_URL:-http://host.docker.internal:54321}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      NETLIFY_CLI_TELEMETRY_DISABLED: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    <<: *dev-volumes

  # Production-style build served with `vite preview` (opt-in):
  #   docker compose --profile preview up --build preview
  preview:
    profiles: ["preview"]
    build:
      context: .
      args:
        BASE_IMAGE: ${BASE_IMAGE:-node:20.19-bookworm-slim}
      target: preview
    ports:
      - "4173:4173"
    environment:
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-http://127.0.0.1:54321}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
      VITE_ENABLE_LOGIN: ${VITE_ENABLE_LOGIN:-true}
      VITE_BYPASS_AUTH: ${VITE_BYPASS_AUTH:-true}
      VITE_AI_API_URL: ${VITE_AI_API_URL:-}

volumes:
  node_modules:
